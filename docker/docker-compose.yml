# Prism — movie collection manager
# https://beaconstack.io/prism
#
#   1. Set the two host paths below.
#   2. docker compose -f docker/docker-compose.yml up -d
#   3. Open http://<this-host>:8282 (no login needed on your own network).
#
# Prism runs on its own: add indexers and a download client in its
# Settings, like Radarr. To run it with Haul, Pilot and Pulse, see
# https://beaconstack.io for examples that connect them.

services:
  prism:
    image: ghcr.io/beacon-stack/prism:latest
    container_name: prism
    restart: unless-stopped
    # Hardening: no Linux capabilities, no privilege gain, and nothing
    # writable except the mounted folders and a small /tmp.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    ports:
      - "8282:8282"
    environment:
      TZ: UTC                       # your timezone, e.g. America/New_York

      # Optional: connect to Pulse
      # Pulse hands Prism its indexers, download clients and quality
      # profiles. To turn it on, set the URL and uncomment the two lines
      # below it. Empty means Prism runs on its own.
      PRISM_PULSE_URL: ""                         # e.g. http://192.168.1.10:9696
      # PRISM_PULSE_API_KEY: <Pulse's API key>    # Pulse → Settings
      # ADVERTISE_HOST: 192.168.1.10              # this host's address, so
      #                                           # Pulse can reach Prism
    volumes:
      # Prism's database and settings. Keep it on a local disk.
      - /path/to/config/prism:/config

      # Your media and downloads, in ONE folder. Prism's library is
      # /data/media/movies (created on first start); point your download
      # client at /data/torrents. Give every app the same folder at /data
      # so imports are instant hardlinks and no path mappings are needed.
      # The folder must be writable by uid 1000.
      - /path/to/data:/data
    healthcheck:
      test: ["CMD", "/prism", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
